[project]
name = "email-extractor"
version = "0.1.0"
description = "Email filtering and HTML table extraction from Outlook and MSG files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "extract-msg>=0.56,<0.57",
    "pydantic>=2.0",
    "pywin32>=311; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["email_handler*"]
